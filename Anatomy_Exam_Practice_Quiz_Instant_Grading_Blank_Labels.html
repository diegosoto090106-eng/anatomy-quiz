const qdiv=document.getElementById('quiz');
qs.forEach((q,i)=>{
 let c=document.createElement('div'); c.className='card';
 let cap=q.caption ? '<div class="caption">'+q.caption+'</div>' : '';
 c.innerHTML='<div class="qnum">Question '+(i+1)+'</div><h3>'+q.q+'</h3>'
   +'<img class="studyimg" src="'+imgs[q.img]+'" alt="Study slide">'
   +cap
   +q.a.map((a,j)=>'<label class="choice"><input type="radio" name="q'+i+'" value="'+j+'" onchange="checkAnswer('+i+','+j+',this)"> '+a+'</label>').join('')+'<div id="feedback'+i+'"></div>';
 qdiv.appendChild(c);
});
function checkAnswer(i, selected, input){{
  const q = qs[i];
  const card = input.closest('.card');
  const choices = card.querySelectorAll('.choice');
  choices.forEach((el,j)=>{{
    el.classList.remove('correct','incorrect');
    const radio = el.querySelector('input');
    radio.disabled = true;
    if(j === q.c) el.classList.add('correct');
  }});
  const feedback = document.getElementById('feedback'+i);
  feedback.className = 'feedback';
  if(selected === q.c){{
    feedback.classList.add('correct');
    feedback.textContent = '✓ Correct!';
  }} else {{
    feedback.classList.add('incorrect');
    feedback.textContent = '✗ Incorrect — the correct answer is: ' + q.a[q.c];
    choices[selected].classList.add('incorrect');
  }}
}}

function grade(){
 let score=0, unanswered=0;
 qs.forEach((q,i)=>{let x=document.querySelector('input[name=q'+i+']:checked'); if(!x) unanswered++; else if(+x.value===q.c) score++;});
 let pct=Math.round(score/qs.length*100);
 let msg=pct>=90?'🔥 Excellent!':pct>=80?'💪 Great job!':pct>=70?'👍 Keep studying!':'📚 Review these structures and try again!';
 let r=document.getElementById('result'); r.style.display='block';
 r.innerHTML=msg+'<br>'+score+' / '+qs.length+' correct ('+pct+'%)'+
   (unanswered ? '<br><span class="small">'+unanswered+' unanswered</span>' : '');
 window.scrollTo(0,0);
}
